name: Release

# Obsidian installs a plugin from three loose files, not from a zip: BRAT and the community
# plugin browser both fetch main.js / manifest.json / styles.css from the release assets by
# name. They are therefore attached individually; the zip is a convenience for manual installs.
on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # The build type-checks first, so a release can never be cut from code that does not
      # compile; the tests keep the format guarantees (codec, .order, git safety) honest.
      - run: npm test
      - run: npm run build

      - name: Check the tag matches manifest.json
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $TAG does not match manifest.json version $VERSION" >&2
            exit 1
          fi

      - name: Package
        run: |
          mkdir -p dist/azure-devops-wiki
          cp main.js manifest.json styles.css dist/azure-devops-wiki/
          cd dist && zip -r azure-devops-wiki.zip azure-devops-wiki

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
            dist/azure-devops-wiki.zip
